
name: scheduled_jobs

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV: production
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PORT: ${{ secrets.DB_PORT || '3306' }}
      DB_SSL: ${{ secrets.DB_SSL || 'false' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FRONTEND_ACCOUNT_URL: ${{ secrets.FRONTEND_ACCOUNT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Expire payments
        run: uv run python -m jobs.expire_payments

      - name: Expire subscriptions and send expiry emails
        run: uv run python -m jobs.expire_subscriptions

      - name: Send subscription expiry reminders
        run: uv run python -m jobs.send_subscription_reminders

